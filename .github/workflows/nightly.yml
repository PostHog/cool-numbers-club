# Nightly rebuild.
#
# Cloudflare Pages has no scheduler of its own, so this is the alarm clock:
# it pings a Pages deploy hook and Cloudflare does the rest -- checks out the
# repo, runs `npm run build`, and publishes. The fresh data comes from the
# fetch step inside that build, so nothing is committed here.
#
# Setup:
#   1. Cloudflare Pages > your project > Settings > Builds > Deploy hooks.
#      Create one named "nightly" on the main branch and copy the URL.
#   2. Add it here as a repository secret named CLOUDFLARE_DEPLOY_HOOK.

name: Nightly rebuild

on:
  schedule:
    # 06:00 UTC daily. GitHub's scheduler is best-effort and can run late.
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Cloudflare Pages build
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::CLOUDFLARE_DEPLOY_HOOK is not set. See the comments in this workflow."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
          echo "Deploy requested."
