# Nightly refresh of the club register.
#
# The fetch needs a GitHub token -- the GraphQL API rejects anonymous requests,
# and anonymous REST is capped at 60/hour, below what a full pass needs. Nobody
# has to create one: Actions injects `secrets.GITHUB_TOKEN` automatically, so
# there is no PAT to mint, store or rotate.
#
# This commits the refreshed data and the re-rendered social card, and
# Cloudflare rebuilds and deploys on that push. That means Cloudflare never talks
# to the GitHub API and needs no secrets at all -- its build command just renders
# the committed JSON.
#
# Commits go through the REST API rather than `git push` so that GitHub signs
# them, satisfying branch rules that require verified signatures. That endpoint
# takes one file per commit, hence the loop.
#
# Setup: none, beyond connecting Cloudflare to this repo.

name: Refresh the register

on:
  schedule:
    # 06:00 UTC daily. GitHub's scheduler is best-effort and can run late.
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA: the PostHog org requires it, and a tag can
      # be moved to point at different code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # No dependencies to install -- the project has none.
      - name: Fetch the latest claims
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run fetch

      # The card carries the newest members' names, so it is only worth
      # redrawing when the register actually moved. `npm run og` uses the Chrome
      # that is already on the runner -- still nothing to install.
      - name: Redraw the social card
        run: |
          if git diff --quiet -- data/achievements.json; then
            echo "Register unchanged. Leaving the card alone."
            exit 0
          fi
          npm run og

      # Do NOT add [skip ci] (or [CI Skip] / [CF-Pages-Skip]) to this commit
      # message. Cloudflare treats those as "do not deploy" and the nightly
      # refresh would silently stop publishing.
      #
      # It is not needed anyway: pushes made with GITHUB_TOKEN do not trigger
      # `on: push` workflows, so there is no loop to guard against. That
      # suppression is scoped to Actions runs and does not affect the webhook
      # Cloudflare listens on.
      - name: Commit if the register changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- data/achievements.json; then
            echo "No new claims. Nothing to deploy."
            exit 0
          fi

          # Commit through the API rather than `git push`. Commits created this
          # way are signed by GitHub, which satisfies the org's
          # verified-signatures rule without storing a signing key anywhere.
          # It writes one file per call, so the card and the register land as
          # two commits; the last push is what Cloudflare rebuilds from.
          commit() {
            file=$1
            message=$2
            git diff --quiet -- "$file" && return 0

            current=$(gh api "repos/$GITHUB_REPOSITORY/contents/$file?ref=$GITHUB_REF_NAME" --jq .sha)

            # Via a file, not an argument: base64 of the register is ~150KB and
            # a single argument caps out at 128KB.
            base64 -w0 "$file" > /tmp/content.b64

            jq -n \
              --arg message "$message" \
              --arg branch  "$GITHUB_REF_NAME" \
              --arg sha     "$current" \
              --rawfile content /tmp/content.b64 \
              '{message: $message, branch: $branch, sha: $sha, content: ($content | rtrimstr("\n"))}' \
              > /tmp/commit.json

            gh api --method PUT "repos/$GITHUB_REPOSITORY/contents/$file" \
              --input /tmp/commit.json --jq '.commit.html_url'
          }

          commit src/og.png 'Redraw the social card'
          commit data/achievements.json 'Refresh the club register'

          echo "Register updated. Cloudflare will redeploy on this push."
